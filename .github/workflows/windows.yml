name: Windows launcher checks
on:
  push:
    paths: ['internal/localproc/**', 'internal/runcontrol/**', 'scripts/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['internal/localproc/**', 'internal/runcontrol/**', 'scripts/**', '.github/workflows/windows.yml']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      DANMAKUFLOW_MYSQL_DSN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.14'
      - name: Serial native fake-process and private-control tests
        run: go test -timeout 120s -p 1 -parallel 1 -count=1 -v ./internal/localproc ./internal/runcontrol
      - name: Parse PowerShell scripts without running them
        shell: powershell
        run: |
          if (Test-Path scripts) {
            Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
              $tokens = $null; $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
            }
          }
      - name: First and repeated setup with dummy credentials (Windows PowerShell)
        shell: powershell
        run: ./scripts/tests/setup-local.test.ps1
      - name: First and repeated setup with dummy credentials (PowerShell Core)
        shell: pwsh
        run: ./scripts/tests/setup-local.test.ps1
