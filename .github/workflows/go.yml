name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      DANMAKUFLOW_MYSQL_DSN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.14'
      - name: Check lifecycle Go formatting without changing source
        shell: python
        run: |
          import subprocess
          paths = ["cmd/server", "cmd/consumer", "cmd/launcher", "internal/runcontrol",
                   "internal/localproc", "internal/launcher", "internal/consumer", "internal/ws",
                   "internal/api/chat_handler.go", "internal/infra/redis.go",
                   "internal/infra/kafka.go", "internal/repo/message_repo.go"]
          files = subprocess.check_output(["git", "ls-files", "--", *paths], text=True).splitlines()
          result = subprocess.check_output(["gofmt", "-l", *[f for f in files if f.endswith(".go")]], text=True)
          if result.strip():
              raise SystemExit("Go files need formatting:\n" + result)
      - name: Prove duplicate stop requests cannot run twice
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path("internal/runcontrol/control.go")
          original = path.read_text()
          marker = " || req.ID == last"
          if marker not in original:
              raise SystemExit("Update the duplicate request mutation point")
          try:
              path.write_text(original.replace(marker, " || (req.ID == last && false)", 1))
              result = subprocess.run(["go", "test", "-p", "1", "-parallel", "1", "-count=1", "-run", "^TestFailedRequestIsNotRepeatedAndNewRequestCanRetry$", "./internal/runcontrol"], capture_output=True, text=True)
              if result.returncode == 0 or "--- FAIL: TestFailedRequestIsNotRepeatedAndNewRequestCanRetry" not in result.stdout:
                  print(result.stdout, result.stderr)
                  raise SystemExit("Duplicate-stop regression was not detected")
              print("Duplicate-stop regression correctly detected.")
          finally:
              path.write_text(original)
      - name: Prove the startup regression test rejects DropTable
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("internal/infra/db.go")
          original = path.read_text()
          marker = "\treturn db, nil\n}"
          if original.count(marker) != 1:
              raise SystemExit("Update the regression mutation point for the new connection implementation")
          try:
              # Only the SQL-mock test runs against this temporary mutation.
              # It must reject the old bug even when the SQL error is ignored.
              path.write_text(original.replace(marker, '\t_ = db.Migrator().DropTable("danmaku_messages")\n' + marker))
              result = subprocess.run(
                  ["go", "test", "-p", "1", "-parallel", "1", "-count=1", "-run",
                   "^TestRepeatedConnectionExecutesNoSchemaOrDataWrites$", "./internal/infra"],
                  capture_output=True, text=True)
              if result.returncode == 0 or "unexpected database write" not in result.stdout + result.stderr:
                  print(result.stdout, result.stderr)
                  raise SystemExit("Regression test did not detect startup database writes")
              print("Regression test correctly rejected the destructive startup mutation.")
          finally:
              path.write_text(original)
      - name: Prove the schema regression test rejects nullable timestamps
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("internal/infra/schema.go")
          original = path.read_text()
          marker = "send_time DATETIME(3) NOT NULL"
          if original.count(marker) != 1:
              raise SystemExit("Update the timestamp regression mutation point")
          try:
              path.write_text(original.replace(marker, "send_time DATETIME(3) NULL"))
              result = subprocess.run(
                  ["go", "test", "-p", "1", "-parallel", "1", "-count=1", "-run",
                   "^TestRepeatedMigrationOnlyCreatesMissingTables$", "./internal/infra"],
                  capture_output=True, text=True)
              if result.returncode == 0 or "--- FAIL: TestRepeatedMigrationOnlyCreatesMissingTables" not in result.stdout:
                  print(result.stdout, result.stderr)
                  raise SystemExit("Regression test did not detect the weakened timestamp constraint")
              print("Regression test correctly rejected nullable timestamps.")
          finally:
              path.write_text(original)
      - name: Unit tests (no database or services)
        run: go test -p 1 -parallel 1 -count=1 -v ./...
      - name: Validate container configuration without starting services
        env:
          MYSQL_ROOT_PASSWORD: ci-validation-only
          DANMAKUFLOW_MYSQL_DSN: root:ci-validation-only@tcp(mysql:3306)/danmakuflow?parseTime=true
        run: docker compose --project-name danmakuflow-ci --profile setup config --quiet
      - name: Lifecycle race checks (fakes only, serial)
        run: go test -race -p 1 -parallel 1 -count=1 ./internal/ws ./internal/consumer ./internal/launcher ./internal/runcontrol ./cmd/consumer
      - name: Build
        run: go build -p 1 ./...
      - name: Vet
        run: go vet -p 1 ./...
