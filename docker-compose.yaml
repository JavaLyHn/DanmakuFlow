# Local, single-node development services. The host launcher owns start/stop.
# Use --project-name danmakuflow-local --env-file .local/docker/docker.env.
x-local: &local
  restart: "no"
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "2"

x-app: &app
  <<: *local
  image: danmakuflow-local-app:dev
  build:
    context: .
    dockerfile: Dockerfile
  cpus: "0.50"
  mem_limit: 192m
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,mode=1777
  stop_grace_period: 45s
  environment:
    DANMAKUFLOW_MYSQL_DSN: ${DANMAKUFLOW_MYSQL_DSN:?Set the container MySQL DSN in .local/docker/docker.env}
    DANMAKUFLOW_REDIS_ADDR: redis:6379
    DANMAKUFLOW_KAFKA_BROKERS: kafka:29092
    GOMAXPROCS: "2"
    GOMEMLIMIT: 128MiB

services:
  mysql:
    <<: *local
    image: mysql:8.4.13
    cpus: "0.50"
    mem_limit: 512m
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a private password in .local/docker/docker.env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: danmakuflow
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=40
      - --table-open-cache=128
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot --connect-timeout=3 -Nse 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  redis:
    <<: *local
    image: redis:7.4.12-alpine3.21
    cpus: "0.25"
    mem_limit: 64m
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  kafka:
    <<: *local
    image: apache/kafka:4.1.2
    cpus: "0.75"
    mem_limit: 768m
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # This ID identifies the local persisted cluster; keep it with kafka-data.
      CLUSTER_ID: s7GdfVmBRGi6TxKLfYRYlw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_NETWORK_THREADS: "1"
      KAFKA_NUM_IO_THREADS: "2"
      KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR: "1"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_JVM_PERFORMANCE_OPTS: -server -XX:+UseG1GC -XX:ActiveProcessorCount=2
    volumes:
      - kafka-data:/var/lib/kafka/data
    tmpfs:
      - /etc/kafka/secrets:rw,noexec,nosuid,size=1m,mode=1777
      - /mnt/shared/config:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx96m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null"]
      interval: 30s
      timeout: 20s
      retries: 8
      start_period: 120s

  server:
    <<: *app
    command: ["/app/server", "-port", "8080", "-web-dir", "/app/web"]
    ports:
      - "127.0.0.1:8080:8080"

  consumer:
    <<: *app
    command: ["/app/consumer"]

  # Setup jobs are explicit. Runtime services never depend on them.
  migrate:
    <<: *app
    profiles: ["setup"]
    command: ["/app/migrate"]

  kafka-init:
    <<: *local
    image: apache/kafka:4.1.2
    profiles: ["setup"]
    cpus: "0.50"
    mem_limit: 192m
    environment:
      KAFKA_HEAP_OPTS: -Xms32m -Xmx96m
      KAFKA_JVM_PERFORMANCE_OPTS: -server -XX:+UseG1GC -XX:ActiveProcessorCount=2
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "danmaku_save_topic", "--partitions", "1", "--replication-factor", "1"]
    tmpfs:
      - /var/lib/kafka/data:rw,noexec,nosuid,size=1m,mode=1777
      - /etc/kafka/secrets:rw,noexec,nosuid,size=1m,mode=1777
      - /mnt/shared/config:rw,noexec,nosuid,size=16m,mode=1777

volumes:
  mysql-data:
  kafka-data:
